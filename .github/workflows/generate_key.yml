name: Gerar Nova Chave

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar keystore
        run: |
          SENHA="DvPlus2026$(date +%s)Segura"
          keytool -genkey -v -keystore devocionalplus-release-key-v3.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias devocionalplus \
            -storepass "$SENHA" \
            -keypass "$SENHA" \
            -dname "CN=DevocionalPlus, OU=App, O=DevocionalPlus, L=Brasil, S=BR, C=BR"
          echo "storepass=$SENHA" > senha.txt

      - name: Upload da chave
        uses: actions/upload-artifact@v4
        with:
          name: nova-chave-v3
          path: |
            devocionalplus-release-key-v3.jks
            senha.txt
